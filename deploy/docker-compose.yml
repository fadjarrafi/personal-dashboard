# Disalin otomatis ke DEPLOY_DIR oleh .github/workflows/ci-cd.yml setiap deploy.
# Edit file ini di repo, bukan di server.
services:
  app:
    image: ghcr.io/fadjarrafi/personal-dashboard:${IMAGE_TAG:-latest}
    container_name: personal-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      # Path di dalam container - jangan dioverride dari .env.
      DATABASE_URL: /app/data/app.db
      RECEIPT_DIR: /app/data/receipts
      BOARD_DIR: /app/data/boards
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - '5173:5173'
    volumes:
      - ./data:/app/data
      # Vault sync (opsional) - mount mirror rclone di host, path di container
      # harus sama dengan VAULT_MIRROR_PATH di .env.
      # - /srv/vault-mirror:/srv/vault-mirror
