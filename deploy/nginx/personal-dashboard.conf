# /etc/nginx/sites-available/personal-dashboard.conf
# Aktifkan: sudo ln -s /etc/nginx/sites-available/personal-dashboard.conf /etc/nginx/sites-enabled/
# Ganti dashboard.example.com dengan domain Anda sebelum certbot dijalankan.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # Certbot akan menaruh challenge di sini; setelahnya seluruh trafik di-redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.example.com;

    # Certbot akan menulis dua baris ssl_certificate di sini setelah `certbot --nginx`.
    # Contoh (isi otomatis oleh certbot):
    # ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # PWA butuh HTTPS + header aman berikut
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batas upload — cocokkan dengan BODY_SIZE_LIMIT di systemd unit
    client_max_body_size 1M;

    # Cache aset statis SvelteKit (immutable hash di path)
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
